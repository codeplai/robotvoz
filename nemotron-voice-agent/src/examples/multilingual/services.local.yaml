# On-prem catalog. Entries are grouped by platform name for readability; the
# backend merges all sections and exposes only the reachable ones. Compose
# endpoints are rewritten to localhost for host-native runs.

workstation:
  llm:
    nemotron-nano:
      name: "Nemotron 3 Nano 30B A3B"
      model_id: "nvidia/nemotron-3-nano"
      base_url: "http://nvidia-llm:8000/v1"
      supported_languages: [en, de, es, fr, it, ja]
      system_prompt: ""
      extra_params: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":false},"repetition_penalty":1.05}}'
  tts:
    magpie-multilingual-tts:
      name: "Magpie TTS"
      server: "tts-service:50051"
      voice_id: "Magpie-Multilingual.EN-US.Aria"
      model: "magpie-tts-multilingual"
      function_id: ""
      synthesis_mode: stitched
    chatterbox-multilingual-tts:
      name: "Chatterbox TTS Multilingual"
      server: "chatterbox-tts-service:50051"
      voice_id: "Chatterbox-Multilingual.en-US.Male"
      model: "chatterbox-tts-multilingual"
      function_id: ""
      synthesis_mode: per_sentence
    magpie-zeroshot-tts:
      name: "Magpie TTS Zeroshot"
      server: "magpie-zeroshot-tts-service:50051"
      voice_id: "Magpie-ZeroShot-Multilingual.Female"
      model: "magpie-tts-zeroshot"
      function_id: ""
      synthesis_mode: stitched
  asr:
    parakeet-rnnt:
      name: "Parakeet 1.1B RNNT Multilingual ASR"
      server: "parakeet-rnnt-asr:50052"
      model: "parakeet-1.1b-rnnt-multilingual-asr"
      function_id: ""
    nemotron-asr-streaming-multilingual:
      name: "Nemotron ASR Streaming Multilingual"
      server: "nemotron-asr-streaming-multilingual:50052"
      model: "cache-aware-parakeet-rnnt-multi-asr-streaming-sortformer"
      language_code: "auto"
      function_id: ""

dgxspark:
  llm:
    # Qwen3.5-4B: 9.3 GB, denso, 201 idiomas, contexto de 262K.
    #
    # Razonamiento DESACTIVADO con chat_template_kwargs.enable_thinking=false.
    # Qwen3.5 razona por defecto, generando <think>...</think> antes de
    # responder. En un robot eso es inaceptable: añade segundos de latencia y
    # el sintetizador acabaria pronunciando su propio razonamiento.
    # A diferencia del Nemotron Nano v2, Qwen SI obedece este parametro, asi
    # que system_prompt va vacio (no hace falta la directiva /no_think).
    #
    # Parametros de muestreo recomendados por Qwen para modo sin razonamiento:
    # temperature=0.7, top_p=0.8, top_k=20, presence_penalty=1.5.
    #
    # supported_languages se limita a los que tambien cubre Magpie TTS; el
    # blueprint muestra en la interfaz la interseccion de ASR, TTS y LLM.
    qwen35-4b:
      name: "Qwen3.5 4B"
      model_id: "Qwen/Qwen3.5-4B"
      base_url: "http://nvidia-llm-vllm:8000/v1"
      supported_languages: [en, es, fr, de, it, ja, ko, pt, zh, hi, ar, vi]
      system_prompt: ""
      extra_params: '{"extra_body":{"chat_template_kwargs":{"enable_thinking":false},"top_k":20,"presence_penalty":1.5},"temperature":0.7,"top_p":0.8}'
  tts:
    # Voz: Diego.Happy, elegida por el usuario tras oir Diego, Neutral y Happy.
    # Se descarto la variante .Calm porque es la mas lenta:
    # la misma frase dura 7.20 s en Diego.Calm frente a unos 5 s en Diego base
    # o Neutral. Magpie NO admite parametro de velocidad: SSML prosody rate
    # apenas cambia la duracion (130% -> -8%) y cualquier clave desconocida en
    # custom_configuration devuelve error 500.
    #
    # Voz española por defecto. La pipeline multilingue reasigna la voz segun
    # el idioma de sesion con resolve_voice_for_language(), asi que esto es la
    # preferencia inicial, no una imposicion. Alternativas en es-US: Diego, y
    # variantes emocionales de ambas (.Calm .Happy .Angry .Neutral .Sad y,
    # solo en Diego, .PleasantSurprised).
    magpie-multilingual-tts:
      name: "Magpie TTS"
      server: "tts-service:50051"
      voice_id: "Magpie-Multilingual.ES-US.Diego.Happy"
      model: "magpie-tts-multilingual"
      function_id: ""
      synthesis_mode: stitched
    chatterbox-multilingual-tts:
      name: "Chatterbox TTS Multilingual"
      server: "chatterbox-tts-service:50051"
      voice_id: "Chatterbox-Multilingual.en-US.Male"
      model: "chatterbox-tts-multilingual"
      function_id: ""
      synthesis_mode: per_sentence
    magpie-zeroshot-tts:
      name: "Magpie TTS Zeroshot"
      server: "magpie-zeroshot-tts-service:50051"
      voice_id: "Magpie-ZeroShot-Multilingual.Female"
      model: "magpie-tts-zeroshot"
      function_id: ""
      synthesis_mode: stitched
  asr:
    parakeet-rnnt:
      name: "Parakeet 1.1B RNNT Multilingual ASR"
      server: "parakeet-rnnt-asr:50052"
      model: "parakeet-1.1b-rnnt-multilingual-asr"
      function_id: ""
    nemotron-asr-streaming-multilingual:
      name: "Nemotron ASR Streaming Multilingual"
      server: "nemotron-asr-streaming-multilingual:50052"
      model: "cache-aware-parakeet-rnnt-multi-asr-streaming-sortformer"
      language_code: "auto"
      function_id: ""
